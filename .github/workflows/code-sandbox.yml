name: Python worker compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'satrap/**'
      - 'tests/**'
      - 'scripts/**'
      - 'satrap-ui/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/code-sandbox.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install execution dependencies
        run: |
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          python -m pip install '.[sandbox,vector,video,web-js]' -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise integrated unit flows once
        run: |
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          python -m pytest tests/unit -q --durations=20 -o faulthandler_timeout=90
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: satrap-ui/package-lock.json
      - run: npm ci
        working-directory: satrap-ui
      - run: npm test
        working-directory: satrap-ui
      - run: npm run build
        working-directory: satrap-ui
      - run: npx playwright install --with-deps chromium
        working-directory: satrap-ui
      - name: Exercise authentication recovery and paged chat flows
        working-directory: satrap-ui
        run: |
          node e2e/run.mjs --case backend-password-recovery
          node e2e/run.mjs --case runtime-cleanup
          node e2e/run.mjs --case attached-service-password-recovery
          node e2e/run.mjs --case chat-fork-projects
          node e2e/run.mjs --case chat-sidebar-state
          node e2e/run.mjs --case chat-history-races
          node e2e/run.mjs --case runtime-application-progress
