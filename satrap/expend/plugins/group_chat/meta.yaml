name: group_chat
version: 0.1.0
author: Satrap Team
description: "在当前群查找成员, 查看聊天记录, 回复时引用消息和 @ 多人"
config_schema:
  message_limit:
    type: number
    default: 100
    minimum: 1
    maximum: 100
    integer: true
    description: "每次最多返回多少条聊天记录; 工具不指定数量时请求 20 条"
  member_limit:
    type: number
    default: 50
    minimum: 1
    maximum: 50
    integer: true
    description: "每次最多返回多少位成员; 工具不指定数量时请求 10 位"
  text_budget:
    type: number
    default: 12000
    minimum: 128
    maximum: 100000
    integer: true
    description: "每次查询最多返回多少个正文字符; 超出的内容会省略, 并标明结果不完整"
  member_cache_ttl:
    type: number
    default: 60
    minimum: 0
    maximum: 300
    integer: true
    description: "成员查询结果缓存多久, 单位为秒; 0 表示每次新查询都刷新, 翻页仍沿用短期缓存"
tools:
  group_chat_reply: "回复群消息, 支持引用和 @ 多人"
  group_chat_find_members: "按昵称或群名片查找成员"
  group_chat_get_member: "查看指定成员的昵称和群名片"
  group_chat_get_message: "查看一条消息的原文和发送者"
  group_chat_recent_messages: "查看最近的聊天记录"
  group_chat_search_messages: "按关键词, 成员和时间搜索聊天记录"
handlers:
  group_chat.environment: "告诉模型当前群, 发言者, 机器人身份和可用功能"
skills:
  group_chat: "指导模型查记录, 找人, 引用消息和 @ 对方"
compatibility:
  satrap: ">=0.1,<0.2"
applicability:
  session_types: [platform]
  platforms: "*"
