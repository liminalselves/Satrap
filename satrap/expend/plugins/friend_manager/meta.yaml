name: friend_manager
permission_schema_version: 1
management_permissions:
  access:
    description: 查询完整好友目录和全部好友申请
    requirements: [来源发送者和机器人账号必须有效, 普通用户的本人服务由宿主单独核验]
    caller_list: managers
    empty_policy: deny
    system_admin: true
  write:
    description: 处理好友申请, 申请删除好友或主动发送好友申请
    requirements: [需开启对应好友写功能, 删除好友固定需要人工批准, 受保护账号不能删除]
    caller_list: write_callers
    empty_policy: deny
    system_admin: true
tool_permissions:
  friend_manager_list_friends: [access]
  friend_manager_find_friends: [access]
version: 0.1.0
author: Satrap Team
description: "查询机器人好友, 查找昵称或备注, 处理好友申请; 删除好友须人工批准"
config_schema:
  managers:
    type: textarea
    default: ""
    description: "允许查看完整好友目录和全部申请的成员 ID, 每行一个; 留空不授予名单权限. 普通用户仍可管理本人申请和好友关系; 系统管理员无需重复填写, 名单账号禁止被模型删除"
  write_callers:
    type: textarea
    default: ""
    description: "允许处理好友申请, 请求删除好友和主动发送好友申请的成员账号 ID, 每行一个; 留空不授予名单权限. 已获本插件授权的系统管理员无需重复填写; 还需好友访问授权和对应功能开关, 删除仍须人工批准"
  request_handling_enabled:
    type: bool
    default: false
    description: "允许模型同意或拒绝好友申请; 普通用户只可处理本人申请, 管理员处理他人须写授权; 不影响后台人工操作"
  delete_friend_enabled:
    type: bool
    default: false
    description: "允许模型申请删除好友; 普通用户只可删除本人, 管理员删除他人须写授权; 必须在后台人工批准后执行"
  send_request_enabled:
    type: bool
    default: false
    description: "允许模型发送好友申请; 普通用户只能添加本人, 管理员指定其他人需要访问和写权限, 平台须支持主动申请"
  protected_friend_ids:
    type: textarea
    default: ""
    description: "额外禁止模型删除的好友 ID, 每行一个; 后台人工删除遵守账号级保护名单"
tools:
  friend_manager_list_friends: "查看机器人好友列表"
  friend_manager_find_friends: "按 ID, 昵称或备注查找好友"
  friend_manager_list_requests: "查看待处理好友申请"
  friend_manager_recheck_request: "重新核验好友申请"
  friend_manager_handle_request: "同意或拒绝好友申请"
  friend_manager_delete_friend: "申请删除好友, 等待人工批准"
  friend_manager_send_request: "主动发送好友申请"
skills:
  friend_manager: "指导模型确认好友身份, 处理申请与区分执行结果"
compatibility:
  satrap: ">=0.1,<0.2"
applicability:
  session_types: [platform]
  platforms: "*"
