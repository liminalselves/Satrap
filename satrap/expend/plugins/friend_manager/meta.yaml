name: friend_manager
permission_schema_version: 1
management_permissions:
  access:
    description: 在私聊中查询和管理机器人的好友
    caller_list: managers
    empty_policy: deny
    system_admin: true
  write:
    description: 处理好友申请和提交删除好友请求
    caller_list: write_callers
    empty_policy: deny
    system_admin: true
tool_permissions:
  friend_manager_list_friends: [access]
  friend_manager_find_friends: [access]
  friend_manager_list_requests: [access]
  friend_manager_handle_request: [access, write]
  friend_manager_delete_friend: [access, write]
version: 0.1.0
author: Satrap Team
description: "查询机器人好友, 查找昵称或备注, 处理好友申请; 删除好友须人工批准"
config_schema:
  managers:
    type: textarea
    default: ""
    description: "哪些人可以在私聊中让模型查看和搜索机器人好友, 查看好友申请. 填写成员账号 ID, 每行一个; 留空时禁用全部好友工具; 处理申请和删除好友另需写操作授权, 名单中的账号禁止被模型删除"
  write_callers:
    type: textarea
    default: ""
    description: "哪些人可以在私聊中让模型同意或拒绝好友申请, 或申请删除好友. 填写成员账号 ID, 每行一个; 必须同时在好友管理者名单中并开启对应功能; 留空时禁用全部模型好友写操作, 删除好友仍须人工批准"
  request_handling_enabled:
    type: bool
    default: false
    description: "允许管理者让模型同意或拒绝好友申请; 不影响后台人工操作"
  delete_friend_enabled:
    type: bool
    default: false
    description: "允许管理者让模型申请删除好友; 必须在后台人工批准后执行"
  protected_friend_ids:
    type: textarea
    default: ""
    description: "额外禁止模型删除的好友 ID, 每行一个; 后台人工删除遵守账号级保护名单"
tools:
  friend_manager_list_friends: "查看机器人好友列表"
  friend_manager_find_friends: "按 ID, 昵称或备注查找好友"
  friend_manager_list_requests: "查看待处理好友申请"
  friend_manager_handle_request: "同意或拒绝好友申请"
  friend_manager_delete_friend: "申请删除好友, 等待人工批准"
skills:
  friend_manager: "指导模型确认好友身份, 处理申请与区分执行结果"
compatibility:
  satrap: ">=0.1,<0.2"
applicability:
  session_types: [platform]
  platforms: "*"
