name: base_take
version: 0.1.0
author: Satrap Team
repo: https://github.com/satrap/base_take
description: "基础能力插件: 联网搜索 / 网页抓取 / 代码沙箱 / 文档读取"

# 配置项声明 (键 -> 类型/默认值/描述), 供校验/存储/前端渲染表单
config_schema:
  sandbox_root:
    type: path
    default: ""
    description: "独立调用的沙箱兜底路径 (平台运行时固定使用会话私有 sandbox)"
  allowed_env_vars:
    type: string
    default: ""
    description: "沙箱子进程显式放行的环境变量名 (逗号分隔); 其余密钥类变量 (如 *_API_KEY, *_TOKEN) 默认剥离"
  workspace_root:
    type: path
    default: ""
    description: "工作区根目录 (read_document 路径白名单, 留空用项目根)"
  search_timeout:
    type: number
    default: 10
    description: "搜索/网页抓取超时秒数"
# 能力组成描述 (可选, 名字 -> 描述; 仅作展示补充, 自动扫描为注册真相源)
tools:
  search: 联网搜索
  fetch_page: 抓取网页内容
  code_sandbox: 在代码沙箱中执行代码或管理文件 (与 coding 启用时由服务层协调停用)
  read_document: 读取文档文本, 按模型能力分页查看 PDF 图像 (xlsx/docx/pdf/txt/md)

compatibility:
  satrap: ">=0.1,<0.2"

applicability:
  session_types: [chat, platform, embedded]
  platforms: "*"
