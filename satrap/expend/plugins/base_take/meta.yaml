name: base_take
version: 0.1.0
author: Satrap Team
repo: https://github.com/satrap/base_take
description: "基础能力插件: 联网搜索 / 网页抓取 / 代码沙箱 / 文档读取"

# 配置项声明 (键 -> 类型/默认值/描述), 供校验/存储/前端渲染表单
config_schema:
  sandbox_root:
    type: path
    default: ""
    description: "独立调用的沙箱兜底路径 (平台运行时固定使用会话私有 sandbox)"
  sandbox_allowed_modules:
    type: string
    default: "math,statistics,decimal,fractions,json,csv,re,datetime,time,collections,itertools,functools,random,numpy,numpy.linalg,numpy.random,pandas,matplotlib.pyplot,docx,docx.shared,docx.enum.text,docx.enum.table,docx.enum.section,pptx,pptx.util,pptx.enum.text,pptx.enum.shapes,pptx.dml.color,openpyxl,openpyxl.styles,openpyxl.utils,openpyxl.chart,pypdf,pdfplumber,reportlab.pdfgen.canvas,reportlab.lib.pagesizes,reportlab.lib.units,reportlab.lib.styles,reportlab.platypus,reportlab.pdfbase.pdfmetrics,reportlab.pdfbase.ttfonts"
    description: "模型可导入的已支持模块 (逗号分隔, 子模块需显式登记); 空值禁止导入, 不代表全部允许"
  allowed_env_vars:
    type: string
    default: ""
    description: "沙箱非敏感环境变量允许项 (逗号分隔); 免审批模式不接受密钥或启动/导入控制变量"
  workspace_root:
    type: path
    default: ""
    description: "工作区根目录 (read_document 路径白名单, 留空用项目根)"
  search_timeout:
    type: number
    default: 10
    description: "搜索/网页抓取超时秒数"
# 能力组成描述 (可选, 名字 -> 描述; 仅作展示补充, 自动扫描为注册真相源)
tools:
  search: 联网搜索
  fetch_page: 抓取网页内容
  code_sandbox: 免审批的一次性 Python 与文件操作, 白名单库, 拦截联网/外部程序, 产物不自动发送
  read_document: 读取文档文本, 按模型能力分页查看 PDF 图像 (xlsx/docx/pdf/txt/md)

compatibility:
  satrap: ">=0.1,<0.2"

applicability:
  session_types: [chat, platform, embedded]
  platforms: "*"
