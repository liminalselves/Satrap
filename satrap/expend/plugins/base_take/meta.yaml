name: base_take
version: 0.1.0
author: Satrap Team
repo: https://github.com/satrap/base_take
description: "基础能力插件: 联网搜索 / 网页抓取 / 代码沙箱 / 文档读取 / 长期记忆"

# 配置项声明 (键 -> 类型/默认值/描述), 供校验/存储/前端渲染表单
config_schema:
  sandbox_root:
    type: path
    default: ""
    description: "沙箱根目录 (留空用全局默认 .satrap/sandbox, 与 coding 插件共享)"
  workspace_root:
    type: path
    default: ""
    description: "工作区根目录 (read_document 路径白名单, 留空用项目根)"
  search_timeout:
    type: number
    default: 10
    description: "搜索/网页抓取超时秒数"
  memory_scope:
    type: string
    default: "web_chat"
    description: "记忆作用域 (网页聊天统一 web_chat, 与前端记忆管理对齐)"

# 能力组成描述 (可选, 名字 -> 描述; 仅作展示补充, 自动扫描为注册真相源)
tools:
  search: 联网搜索
  fetch_page: 抓取网页内容
  code_sandbox: 在代码沙箱中执行代码或管理文件 (与 coding 启用时由服务层协调停用)
  read_document: 读取文档并解析为纯文本 (xlsx/docx/pdf/txt/md)
  add_memory: 添加一条长期记忆 (用户偏好/项目约定/关键决策)
  update_memory: 按 ID 更新已有长期记忆
  delete_memory: 按 ID 删除一条长期记忆
  list_memories: 列出全部长期记忆 (含 ID)
handlers:
  base_take.memory_inject: 在用户输入前注入长期记忆上下文
