name: session_commands
version: 0.1.0
author: Satrap Team
description: "平台会话的新建, 历史查看, 切换和关于信息命令"

config_schema:
  about_text:
    type: textarea
    default: ""
    description: "自定义 /about 返回文本, 留空时显示当前 Satrap 会话信息"

commands:
  new: 开始一个新对话
  history: 查看当前对话范围的历史会话
  switch: 切换到当前范围内的历史会话
  about: 查看 Satrap 平台会话信息

compatibility:
  satrap: ">=0.1,<0.2"

applicability:
  session_types: [platform]
  platforms: "*"
