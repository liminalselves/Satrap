name: debug_logger
version: 0.1.0
author: Satrap Team
description: 按群或私聊对象管理高级诊断, 新上下文沿用对象开关
permission_schema_version: 1
management_permissions:
  debug_manage:
    description: 管理当前对象的高级诊断
    system_admin: true
  debug_default_manage:
    description: 管理整体高级诊断默认值
    system_admin: true
commands:
  debug: "高级诊断: /debug on|off|reset|status; 设置绑定当前群或私聊, /new 后保留"
command_permissions: {}
config_schema: {}
tools: {}
services: {}
handlers: {}
skills: {}
mcp: {}
applicability:
  session_types: [chat, platform, embedded]
  platforms: "*"
