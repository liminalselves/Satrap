name: group_admin
permission_schema_version: 1
management_permissions:
  read:
    description: 查询群荣誉和转发内容
    caller_list: allowed_read_callers
    empty_policy: allow
    system_admin: true
  write:
    description: 请求群管理修改和发送操作
    caller_list: allowed_callers
    empty_policy: deny
    system_admin: true
  requests:
    description: 查询和处理入群申请与邀请
    caller_list: request_managers
    empty_policy: deny
    system_admin: true
tool_permissions:
  group_admin_get_honors: [read]
  group_admin_get_forward: [read]
  group_admin_list_group_requests: [read, requests]
  group_admin_send_forward: [write]
  group_admin_recall_message: [write]
  group_admin_kick: [write]
  group_admin_ban: [write]
  group_admin_whole_ban: [write]
  group_admin_ban_anonymous: [write]
  group_admin_set_admin: [write]
  group_admin_set_anonymous: [write]
  group_admin_set_group_nickname: [write]
  group_admin_set_name: [write]
  group_admin_set_title: [write]
  group_admin_leave: [write]
  group_admin_handle_group_request: [write, requests]
version: 0.4.0
author: Satrap Team
description: "管理 OneBot 群的禁言, 群昵称, 群名和入群请求, 查询荣誉与合并转发; 修改和发送操作默认关闭"

config_schema:
  write_tools_enabled:
    type: bool
    default: false
    description: "允许模型执行踢人, 禁言, 修改群昵称等管理操作及发送合并转发; 默认关闭, 需要审批的群管理动作仍须批准"
  allowed_callers:
    type: textarea
    default: ""
    description: "哪些成员可以让模型执行禁言, 踢人, 修改群昵称等管理操作或发送合并转发. 填写成员账号 ID, 每行一个; 留空时拒绝全部模型写操作; 还须开启管理写操作, 需要审批的动作须人工批准"
  allowed_read_callers:
    type: textarea
    default: ""
    description: "允许使用本插件查询工具的成员 ID, 每行一个; 留空不额外限制, 不影响 group_chat 的查询工具"
  high_risk_approval:
    type: bool
    default: false
    description: "踢人, 禁言, 设置管理员, 改群名, 退群及处理加群请求等高危模型操作必须在群管理页面批准; 关闭此项仍遵守宿主审批策略"
  allowed_groups:
    type: textarea
    default: ""
    description: "这些工具可以在哪些群使用, 填写群号, 每行一个; 留空不额外限制群, 仍遵守平台设置的可管理范围"
  request_managers:
    type: textarea
    default: ""
    description: "哪些人可以让模型查看入群申请和邀请, 并同意或拒绝它们. 填写成员账号 ID, 每行一个; 留空时禁用申请查询和处理; 查询还受查询调用者名单限制, 处理还须在管理写操作调用者名单中并开启管理写操作"

tools:
  group_admin_get_honors: "查看群荣誉信息"
  group_admin_get_forward: "查看合并转发消息的内容"
  group_admin_send_forward: "向群发送合并转发消息"
  group_admin_recall_message: "撤回指定消息"
  group_admin_kick: "移出群成员"
  group_admin_ban: "禁言或解除禁言群成员"
  group_admin_whole_ban: "开启或解除全员禁言"
  group_admin_ban_anonymous: "禁言匿名成员"
  group_admin_set_admin: "设置或取消群管理员"
  group_admin_set_anonymous: "开启或关闭群匿名"
  group_admin_set_group_nickname: "修改或清空目标成员的群昵称"
  group_admin_set_name: "修改群名"
  group_admin_set_title: "设置或清除成员的专属头衔"
  group_admin_leave: "退出或解散群"
  group_admin_handle_group_request: "批准或拒绝加群请求或邀请"
  group_admin_list_group_requests: "查询指定群待处理的加群申请和邀请"

compatibility:
  satrap: ">=0.1,<0.2"

applicability:
  session_types: [platform]
  platforms: [onebot, aiocqhttp]
