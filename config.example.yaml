# Satrap 后端配置示例
# 复制为 config.yaml 并填入实际值后使用: satrap run --config config.yaml

# --- 存储路径 ---
model_config_path: null              # 模型配置 JSON 路径
data_root: .satrap/data              # 运行数据根目录, 每个平台实例拥有独立 platform.db
session_class_config_path: null       # Session 类配置 JSON 路径

# --- Session 管理器 ---
default_session_type: default         # 默认 Session 类型
max_sessions: 1000                    # 最大活跃 Session 数
idle_timeout: 3600                    # Session 闲置超时, 单位秒
session_checkpoint: false             # 会话实例化时默认启用状态检查点 (类级/实例级显式配置优先)

# --- 管线参数 ---
rate_limit: 1.0                       # 限流速率
rate_burst: 5                         # 限流突发容量
llm_timeout: 120.0                    # LLM 调用超时, 单位秒
error_feedback: true                  # 出错或限流时是否通知用户

# --- HTTP API ---
# 回环监听会自动生成 .satrap/api-token, CLI 和管理前端会自动使用
# 绑定非回环地址时必须显式设置至少 32 字符的 SATRAP_API_TOKEN
api:
  host: 127.0.0.1
  port: 19870

# --- Session 类注册, name -> class_path ---
# 在此注册的 Session 子类会在启动时自动导入并注册到 SessionClassConfigManager
session_classes:
  # default: my_module.MySession
  # assistant: my_module.AssistantSession

# --- Session 类扫描目录 ---
# 管理面板和 CLI 可以扫描这些目录下的 .py 文件, 发现继承 Session/AsyncSession 的类
session_scan_paths:
  - .satrap/session

# --- Chat 项目工作区根目录 ---
# 目录浏览和项目绑定只能使用这些根目录及其子目录
workspace_roots:
  - .

# --- 平台适配器配置 ---
platforms:
  # 可以配置多个同类型适配器实例, 只要 id 唯一即可
  # 会话默认按消息来源自动绑定, 例如 misskey1 的用户会进入 misskey:misskey1:<user_id>
  # 手动创建会话时也可以通过 adapter_id 绑定到指定实例

  # - id: misskey1
  #   type: misskey
  #   settings:
  #     base_url: https://misskey-one.example.com
  #     api_token: ${MISSKEY1_API_TOKEN}
  #     chat_enabled: true
  #     room_enabled: false

  # - id: misskey2
  #   type: misskey
  #   settings:
  #     base_url: https://misskey-two.example.com
  #     api_token: ${MISSKEY2_API_TOKEN}
  #     chat_enabled: true
  #     room_enabled: false

  # - id: qq_bot
  #   type: onebot
  #   settings:
  #     host: 127.0.0.1
  #     port: 6700
  #     access_token: ${ONEBOT_ACCESS_TOKEN}
  #     enable_private: true
  #     enable_group: true
  #     context_scope: group_member   # 按群成员隔离, 旧配置省略时保留原用户映射
  #     group_whitelist: []   # 留空允许所有群, 非空填写群 ID 字符串
  #     wake_words: []   # 留空仅响应真实 @机器人, 配置后匹配当前正文
  #     message_text_limit: 2000   # 每条消息文本上限 (64-32000), 超长回复优先按段落/换行拆分为多条
  #     reply_with_quote: false   # 群聊回复是否引用触发消息, 私聊与无来源消息 ID 的手动唤醒不添加
  #     reply_with_mention: false   # 群聊回复是否 @发送者, 已有 @ 不重复; 可在 wake_group_overrides 中按群覆盖
  #     quote_lookup: true   # 唤醒后是否回源被引用消息原文 (get_msg, 5 秒/64KiB 预算, 不递归), 作为引用上下文进入模型输入
  #     wake_on_quote_self: false   # 引用机器人消息是否视为唤醒; 需先回源确认被引用者, 引用他人或回源失败不唤醒
